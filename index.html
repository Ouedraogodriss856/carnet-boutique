<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet Boutique</title>
<meta name="description" content="Carnet de caisse pour petit commerçant : ventes, dépenses, dettes clients et bilan du jour. Fonctionne sans connexion.">
<meta name="theme-color" content="#1f2f7a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#eef0f5; --surface:#ffffff; --ink:#141a3a; --muted:#59618a; --line:#d8dce9; --soft:#e5e8f3;
  --hero:#1f2f7a; --on-hero:#f4f5ff; --accent:#f0b429; --good:#17754a; --bad:#b0341f;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0d1024;--surface:#171b3b;--ink:#eceffd;--muted:#9ca4cc;--line:#292f5c;--soft:#20254d;--hero:#26358f;--good:#4fcf92;--bad:#ff8f7a;color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.mast{background:var(--hero);color:var(--on-hero);padding-top:env(safe-area-inset-top,0px)}
.mast .wrap{padding-block:18px 20px}
.mast-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:20px;font-weight:800;margin:0;overflow-wrap:anywhere}
.pro{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:10px;background:var(--accent);color:#141a3a;font-size:12px;font-weight:800;vertical-align:middle}
.status{font-size:12px;opacity:.8}
.date{margin:2px 0 18px;font-size:13px;opacity:.75;text-transform:capitalize}
.lbl{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.big{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(42px,13vw,60px);line-height:1.05;color:var(--accent);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.big small{font-size:.45em;font-weight:700;margin-left:6px;opacity:.9}
.sub{margin:4px 0 0;font-size:13px;opacity:.75}
.teeth{height:9px;background:conic-gradient(from -45deg at bottom,var(--hero) 90deg,transparent 0) 0/18px 100%}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{padding:12px 12px 13px;min-width:0;text-align:left;background:none;border:0;border-left:1px solid var(--line);border-radius:0}
.stat:first-child{border-left:0}
.stat span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;margin-top:2px;font-family:var(--display);font-size:clamp(15px,4.6vw,20px);font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.debt b{color:var(--bad)}
button.stat:hover{background:var(--soft)}

.banner{margin-top:14px;padding:10px 12px;border:1px dashed var(--muted);border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{border:1px solid var(--ink);background:transparent;border-radius:8px;padding:6px 10px;font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;width:max-content;max-width:min(92vw,420px);z-index:20;box-shadow:0 6px 20px #0004;display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;font-size:14px;padding:2px 4px;text-transform:uppercase}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:18px 0 14px;padding:4px;background:var(--soft);border-radius:12px}
.tab{border:0;background:transparent;border-radius:9px;padding:9px 0;font-weight:700;font-size:13px;color:var(--muted);min-width:0}
.tab[aria-selected="true"]{background:var(--hero);color:var(--on-hero)}
.badge{display:inline-block;min-width:16px;margin-left:2px;padding:0 4px;border-radius:10px;background:var(--accent);color:#141a3a;font-size:11px;line-height:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 6px;font-family:var(--display);font-size:16px;font-weight:800}
.card p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.type{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 2px;font-weight:700;font-size:14px}
.type[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{margin:8px 0 14px;font-size:13px;color:var(--muted);min-height:1.4em}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;font-size:17px}
textarea{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:84px;resize:vertical}
input.amt{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.chip{border:1px solid var(--line);background:transparent;border-radius:20px;padding:5px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.go{width:100%;border:0;background:var(--accent);color:#141a3a;border-radius:12px;padding:14px;font-size:17px;font-weight:800;font-family:var(--display)}
.go:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;margin:0 0 10px}
.err:empty{display:none}

.sect{margin:24px 0 8px;font-family:var(--display);font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sect small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;padding-top:6px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;gap:4px}
.col i{display:block;width:100%;background:var(--hero);border-radius:5px 5px 0 0;min-height:3px}
.col.today i{background:var(--accent)}
.col em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:12px;color:var(--muted);margin-top:4px;border-top:1px solid var(--line);padding-top:4px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px}
.ghost.full{width:100%;margin-top:6px}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted)}
.row .a{font-family:var(--display);font-weight:800;font-size:18px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.acts .go{width:auto;padding:8px 14px;font-size:15px}
.acts input{width:9em;padding:8px 10px;font-size:16px}
.mini{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:2px 0}
.kind{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;margin-right:6px}
.day{margin:18px 0 0;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-top:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.lock{filter:blur(4px);user-select:none;pointer-events:none}
.ok{color:var(--good);font-weight:700}
.types.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
select,.srch{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 10px;font-size:16px;color:var(--ink)}
.srch{margin:12px 0 8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cartbox{margin:0 0 14px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.cartbox>span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.cartrow{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:6px;align-items:center}
.cartrow select{grid-column:1/-1}
.cartrow input{padding:10px 6px;font-size:16px;text-align:center}
.cartrow .ghost{padding:10px 12px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.cl:last-child{border-bottom:0}
.cl b{font-variant-numeric:tabular-nums}
.qb{min-width:3em;align-self:start;text-align:center;padding:6px 12px;border-radius:12px;border:0;font-family:var(--display);font-weight:800;font-size:18px;background:var(--soft);color:var(--ink);font-variant-numeric:tabular-nums}
.qb.low{background:var(--accent);color:#141a3a}
.qb.out{background:var(--bad);color:var(--bg)}
.alert{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--soft);border-left:5px solid var(--accent);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.panel{grid-column:1/-1;margin-top:8px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.panel h4{margin:14px 0 6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.panel h4:first-child{margin-top:0}
.panel input[type=text]{background:var(--surface);padding:10px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.two .field{margin-bottom:0}
.sm{padding:10px 14px;font-size:15px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 10px}
.chk input{width:20px;height:20px;flex:none}
.hb{height:8px;margin-top:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.hb i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="mast-top"><h1><span id="shopname">Carnet Boutique</span><span class="pro" id="protag" hidden>PRO</span></h1><span class="status" id="status"></span></div>
    <p class="date" id="date"></p>
    <p class="lbl">Caisse du jour</p>
    <p class="big" id="cash"></p>
    <p class="sub">Argent reçu aujourd'hui moins les dépenses</p>
  </div>
  <div class="teeth"></div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="banner" id="banner" hidden>
    <span>Ces chiffres sont des exemples pour découvrir le carnet.</span>
    <button type="button" data-act="clear-demo">Effacer les exemples</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-act="tab" data-tab="caisse" aria-selected="true">Caisse</button>
    <button class="tab" role="tab" data-act="tab" data-tab="stock" aria-selected="false">Stock<span class="badge" id="ns" hidden></span></button>
    <button class="tab" role="tab" data-act="tab" data-tab="dettes" aria-selected="false">Dettes<span class="badge" id="nd" hidden></span></button>
    <button class="tab" role="tab" data-act="tab" data-tab="histo" aria-selected="false">Journal</button>
    <button class="tab" role="tab" data-act="tab" data-tab="plus" aria-selected="false">Plus</button>
  </div>

  <section id="p-caisse">
    <form class="card" id="form" autocomplete="off">
      <div class="types" role="group" aria-label="Type d'opération">
        <button type="button" class="type" data-act="type" data-type="sale" aria-pressed="true">Vente</button>
        <button type="button" class="type" data-act="type" data-type="expense" aria-pressed="false">Dépense</button>
        <button type="button" class="type" data-act="type" data-type="credit" aria-pressed="false">Crédit</button>
        <button type="button" class="type" data-act="type" data-type="payment" aria-pressed="false">Paiement</button>
      </div>
      <p class="hint" id="hint"></p>
      <div class="cartbox" id="cartbox" hidden>
        <span>Produits vendus (facultatif) : le stock baisse tout seul</span>
        <div class="cartrow"><select id="psel" aria-label="Produit"></select><input type="text" id="pqty" inputmode="numeric" value="1" aria-label="Quantité"><button type="button" class="ghost" data-act="cart-add">Ajouter</button></div>
        <div id="cartlist"></div>
      </div>
      <label class="field"><span>Montant (F CFA)</span>
        <input type="text" id="amt" class="amt" inputmode="numeric" placeholder="0" aria-describedby="err"></label>
      <div class="chips">
        <button type="button" class="chip" data-act="chip" data-add="100">+100</button>
        <button type="button" class="chip" data-act="chip" data-add="500">+500</button>
        <button type="button" class="chip" data-act="chip" data-add="1000">+1 000</button>
        <button type="button" class="chip" data-act="chip" data-add="5000">+5 000</button>
        <button type="button" class="chip" data-act="chip" data-add="0">Effacer</button>
      </div>
      <label class="field"><span id="whol">Détail (facultatif)</span>
        <input type="text" id="who" list="clients" maxlength="60" placeholder="Ex : riz 25 kg"></label>
      <datalist id="clients"></datalist>
      <p class="err" id="err" role="alert"></p>
      <button class="go" type="submit" id="submit">Enregistrer la vente</button>
    </form>

    <h2 class="sect">Ventes des 7 derniers jours <small>crédits inclus</small></h2>
    <div class="card"><div class="bars" id="bars" role="img" aria-label="Ventes par jour"></div><div class="days" id="days"></div></div>
    <button type="button" class="ghost full" data-act="bilan">Copier le bilan du jour pour WhatsApp</button>
  </section>

  <section id="p-stock" hidden></section>
  <section id="p-dettes" hidden></section>
  <section id="p-histo" hidden></section>
  <section id="p-plus" hidden></section>
</main>
<input type="file" id="bkfile" accept=".txt,text/plain" hidden>
<div class="toast" id="toast" hidden role="status"><span id="toastmsg"></span><button type="button" id="toastact" hidden></button></div>

    mv.push({id:typeof m.id==='string'&&m.id?m.id:uid(),ts:Number(m.ts)||0,pid:typeof m.pid==='string'?m.pid:'',pn:typeof m.pn==='string'?m.pn.slice(0,50):'',
      t:m.t,q:q,b:nn(m.b),s:nn(m.s),eid:typeof m.eid==='string'?m.eid.slice(0,40):'',note:typeof m.note==='string'?m.note.slice(0,80):'',d:m.d?1:0});
  });
  mv.sort(function(a,b){return a.ts-b.ts});
  return {v:1,products:ps,moves:mv};
}
function loadStock(){
  var raw=null;
  try{raw=localStorage.getItem(SKEY)}catch(x){storageOK=false}
  if(raw){
    try{var a=sanStock(JSON.parse(raw));if(a)return a}catch(x){}
    try{localStorage.setItem(SKEY_BAD,raw)}catch(x){}
    try{var rp=localStorage.getItem(SKEY_PREV);if(rp){var b=sanStock(JSON.parse(rp));if(b){stockRecovered=true;return b}}}catch(x){}
    stockRecovered=true;
  }
  return {v:1,products:[],moves:[]};
}
function persistStock(){
  if(ST.moves.length>MAXMOVES)ST.moves=ST.moves.slice(-MAXMOVES);
  try{var j=JSON.stringify(ST);localStorage.setItem(SKEY,j);localStorage.setItem(SKEY_PREV,j)}catch(x){storageOK=false}

}
function prodById(id){for(var i=0;i<ST.products.length;i++)if(ST.products[i].id===id)return ST.products[i];return null}

function alerts(){return ST.products.filter(function(p){return pstate(p)!=='ok'}).sort(function(a,b){return a.qty-b.qty||a.name.localeCompare(b.name,'fr')})}
function addMove(p,t,q,o){
  o=o||{};
  var m={id:uid(),ts:o.ts||Date.now(),pid:p.id,pn:p.name,t:t,q:q,b:o.b!==undefined?o.b:p.buy,s:o.s!==undefined?o.s:p.sell,eid:o.eid||'',note:o.note||'',d:p.d?1:0};
  ST.moves.push(m);p.qty=Math.max(0,p.qty+q);return m;
}
function stockValue(){
  var c=0,r=0;ST.products.forEach(function(p){c+=p.qty*p.buy;r+=p.qty*p.sell});
  return {cost:c,retail:r,margin:r-c};
}
function salesStats(days){
  var cut=days?dayStart(Date.now())-(days-1)*DAY:0,per={},tot={units:0,rev:0,cost:0};
  ST.moves.forEach(function(m){
    if((m.t!=='sale'&&m.t!=='return')||m.ts<cut)return;
    var u=-m.q,k=m.pid||m.pn,x=per[k]||(per[k]={pid:m.pid,name:m.pn,units:0,rev:0,cost:0});
    x.units+=u;x.rev+=u*m.s;x.cost+=u*m.b;x.name=m.pn||x.name;
    tot.units+=u;tot.rev+=u*m.s;tot.cost+=u*m.b;
  });
  var list=Object.keys(per).map(function(k){return per[k]}).filter(function(x){return x.units>0}).sort(function(a,b){return b.units-a.units});
  return {tot:tot,list:list,per:per};
}
function itemsOf(eid){
  var out=[];ST.moves.forEach(function(m){if(m.eid===eid&&m.t==='sale')out.push(m.pn+' ×'+(-m.q))});return out;
}
function reverseSale(eid){
  var sales=ST.moves.filter(function(m){return m.eid===eid&&m.t==='sale'});
  if(!sales.length)return 0;
  if(ST.moves.some(function(m){return m.eid===eid&&m.t==='return'}))return 0;
  sales.forEach(function(m){
    var p=prodById(m.pid);
    if(p)addMove(p,'return',-m.q,{eid:eid,b:m.b,s:m.s,note:'Vente annulée'});
    else ST.moves.push({id:uid(),ts:Date.now(),pid:m.pid,pn:m.pn,t:'return',q:-m.q,b:m.b,s:m.s,eid:eid,note:'Vente annulée',d:0});
  });
  persistStock();return sales.length;
}
function removeEntry(id){

  S.entries=S.entries.filter(function(e){return e.id!==id});
  persist();render();return n;
}

/* ---------- calculs ---------- */
function today(){
  var k=dayKey(Date.now()),sales=0,exp=0,cash=0;
  S.entries.forEach(function(e){if(dayKey(e.ts)!==k)return;
    if(e.t==='sale'){sales+=e.amt;cash+=e.amt}else if(e.t==='credit'){sales+=e.amt}
    else if(e.t==='expense'){exp+=e.amt;cash-=e.amt}else if(e.t==='payment'){cash+=e.amt}});
  return {sales:sales,exp:exp,cash:cash};
}
function month(){
  var n=new Date(),m=n.getMonth(),y=n.getFullYear(),sales=0,exp=0,cashin=0;
  S.entries.forEach(function(e){var d=new Date(e.ts);if(d.getMonth()!==m||d.getFullYear()!==y)return;
    if(e.t==='sale'){sales+=e.amt;cashin+=e.amt}else if(e.t==='credit'){sales+=e.amt}
    else if(e.t==='payment'){cashin+=e.amt}else if(e.t==='expense'){exp+=e.amt}});
  return {sales:sales,exp:exp,cashin:cashin,solde:cashin-exp};
}
function debts(){
  var m={};
  S.entries.forEach(function(e){
    if(e.t!=='credit'&&e.t!=='payment')return;
    var k=norm(e.who);if(!k)return;
    var c=m[k]||(m[k]={key:k,name:e.who.trim(),bal:0,last:0});
    c.bal+=e.t==='credit'?e.amt:-e.amt;
    if(e.ts>c.last)c.last=e.ts;
  });
  return Object.keys(m).map(function(k){return m[k]}).filter(function(c){return c.bal>0}).sort(function(a,b){return b.bal-a.bal});
}
function debtTotal(ds){return ds.reduce(function(a,c){return a+c.bal},0)}
function allNames(){
  var s={},out=[];S.entries.forEach(function(e){if((e.t==='credit'||e.t==='payment')&&e.who){var k=norm(e.who);if(!s[k]){s[k]=1;out.push(e.who.trim())}}});
  return out.sort();
}
function ago(ts){var n=Math.round((dayStart(Date.now())-dayStart(ts))/86400000);return n<=0?'aujourd’hui':n===1?'hier':'il y a '+n+' jours'}

function sha256(s){
  if(!window.crypto||!crypto.subtle)return Promise.reject(new Error('nocrypto'));
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
  });
}
function activate(){

  if(raw.length!==8){err.textContent='Le code a 8 lettres et chiffres. Vérifiez-le.';return}
  sha256(SALT+raw).then(function(h){
    var vie=HASHES_VIE.indexOf(h)>=0;
    if(HASHES.indexOf(h)<0&&!vie){err.textContent='Code non reconnu. Vérifiez-le ou demandez-en un autre.';return}
    if((S.used||[]).indexOf(h)>=0){err.textContent='Ce code a déjà été utilisé sur cet appareil. Demandez un nouveau code pour renouveler.';return}
    S.pro=h;S.proAt=nowT();S.life=vie?1:0;S.used=(S.used||[]).concat([h]);persist();render();toast(vie?'Version Pro à vie activée. Merci !':'Version Pro activée pour '+PRO_DAYS+' jours. Merci !');
  },function(){err.textContent='Activation impossible sur ce navigateur. Ouvrez la page dans Chrome.'});
}

/* ---------- sauvegarde / restauration ---------- */
function b64(bytes){var o='',i;for(i=0;i<bytes.length;i+=8192)o+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(o)}
function unb64(t){var o=atob(t),u=new Uint8Array(o.length),i;for(i=0;i<o.length;i++)u[i]=o.charCodeAt(i);return u}
function makeBackup(){
  var json=JSON.stringify({v:3,shop:S.shop,pro:S.pro,proAt:S.proAt,life:S.life,used:S.used,seen:S.seen,entries:S.entries.filter(function(e){return !e.d}),
    stock:{products:ST.products.filter(function(p){return !p.d}),moves:ST.moves.filter(function(m){return !m.d})}});
  var bytes=new TextEncoder().encode(json);
  if(window.CompressionStream){
    try{return new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer().then(function(buf){return 'CARNET2Z:'+b64(new Uint8Array(buf))},function(){return 'CARNET2:'+b64(bytes)})}catch(x){}
  }
  return Promise.resolve('CARNET2:'+b64(bytes));
}
function parseBackup(txt){
  var none=Promise.resolve(null);
  txt=String(txt).replace(/\s+/g,'');
  var m=/^(CARNET1|CARNET2Z|CARNET2):/.exec(txt);if(!m)return none;
  var bytes;try{bytes=unb64(txt.slice(m[0].length))}catch(x){return none}
  function fin(json){
    try{var o=JSON.parse(json),sv=sanitize(o);if(!sv)return null;
      var st=m[1]==='CARNET1'?null:sanStock(o.stock);return {S:sv,stock:st}}catch(x){return null}
  }
  if(m[1]==='CARNET2Z'){
    if(!window.DecompressionStream)return none;
    try{return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer().then(function(b){return fin(new TextDecoder().decode(b))},function(){return null})}catch(x){return none}
  }
  return Promise.resolve(fin(new TextDecoder().decode(bytes)));
}

  }
  else if(a==='remind'){
    var c2=debts().filter(function(x){return x.key===b.dataset.key})[0];if(!c2)return;
    copy('Bonjour '+c2.name+', petit rappel de '+shopLabel()+' : il reste '+money(c2.bal).replace(/ /g,' ')+' à régler. Merci beaucoup !').then(function(ok){toast(ok?'Rappel copié, collez-le dans WhatsApp':'Copie impossible sur cet appareil')});
  }
  else if(a==='bilan'){
    var t=today(),tot=debtTotal(debts());
    var d3=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    copy(('Bilan du '+d3+(S.shop?' ('+S.shop+')':'')+'\nVentes : '+money(t.sales)+'\nDépenses : '+money(t.exp)+'\nCaisse du jour : '+money(t.cash)+'\nDettes clients à recevoir : '+money(tot)+(alerts().length?'\nStock à racheter : '+alerts().slice(0,6).map(function(p){return p.name+' ('+p.qty+')'}).join(', '):'')).replace(/ /g,' ')).then(function(ok){toast(ok?'Bilan copié, collez-le dans WhatsApp':'Copie impossible sur cet appareil')});
  }
  else if(a==='bilan-mois'){
    if(!isPro())return;var m=month(),mn=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    copy(('Bilan de '+mn+(S.shop?' ('+S.shop+')':'')+'\nVentes : '+money(m.sales)+'\nDépenses : '+money(m.exp)+'\nArgent encaissé : '+money(m.cashin)+'\nSolde du mois : '+money(m.solde)).replace(/ /g,' ')).then(function(ok){toast(ok?'Bilan copié':'Copie impossible sur cet appareil')});
  }
  else if(a==='save-shop'){S.shop=($('#shopin').value||'').trim().replace(/\s+/g,' ').slice(0,40);persist();render();toast('Nom enregistré')}
  else if(a==='activate')activate();
  else if(a==='backup'){
    makeBackup().then(function(t){backupText=t;var ta=$('#bk');ta.value=t;ta.focus();ta.select();
      copy(t).then(function(ok){toast(ok?'Sauvegarde copiée. Gardez-la dans WhatsApp ou une note.':'Copiez le texte de la zone à la main')})});
  }
  else if(a==='restore'){
    var txt=$('#bk').value;
    parseBackup(txt).then(function(data){
      if(!data){restoreArm=false;toast('Sauvegarde non reconnue. Collez tout le texte, depuis CARNET.');return}
      if(!restoreArm){restoreArm=true;backupText=txt;renderPlusForce();toast('Touchez encore pour remplacer vos données actuelles');return}
      S=data.S;if(data.stock){ST=data.stock;persistStock()}
      restoreArm=false;backupText='';cart=[];openPid=null;stForm=null;persist();render();toast('Données restaurées : '+S.entries.length+' lignes'+(data.stock?', '+ST.products.length+' produits':''));
    });
  }
  else if(a==='install'&&installEvt){installEvt.prompt();installEvt=null;render()}
  else if(a==='wipe'){
    if(!wipeArm){wipeArm=true;renderPlusForce();setTimeout(function(){if(wipeArm){wipeArm=false;renderPlusForce()}},4000);return}
    S={v:2,shop:S.shop,pro:S.pro,proAt:S.proAt,life:S.life,used:S.used,seen:S.seen,seeded:true,entries:[]};ST={v:1,products:[],moves:[]};cart=[];openPid=null;stForm=null;persistStock();wipeArm=false;persist();render();toast('Toutes les données ont été effacées');
  }
});
function renderPlusForce(){var f=document.activeElement;if(f&&f.blur)f.blur();renderPlus()}
function digitsFmt(n){return n?n.toLocaleString('fr-FR'):''}
$('#amt').addEventListener('input',function(){var n=digits(this.value);this.value=digitsFmt(n)});
document.addEventListener('input',function(ev){
  var t=ev.target;if(!t.closest||!t.closest('#p-stock'))return;
  if(t.classList.contains('num')){t.value=t.classList.contains('raw')?t.value.replace(/\D/g,'').slice(0,7):digitsFmt(digits(t.value))}
  if(t.id==='st-q'){stSearch=t.value;$('#plist').innerHTML=plistHtml();return}
  if(t.id)dr[t.id]=t.type==='checkbox'?t.checked:t.value;
});
document.addEventListener('submit',function(ev){if(ev.target.id==='pform'){ev.preventDefault();saveProduct()}});
$('#bkfile').addEventListener('change',function(){
  var f=this.files&&this.files[0],inp=this;if(!f)return;
  var r=new FileReader();r.onload=function(){
    var txt=String(r.result||'');inp.value='';
    parseBackup(txt).then(function(d){
      if(!d){toast('Fichier non reconnu');return}
      backupText=txt;restoreArm=true;setTab('plus');toast('Fichier lu. Touchez « Confirmer » pour remplacer vos données');
    });
  };r.onerror=function(){toast('Lecture du fichier impossible')};r.readAsText(f);
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.id==='payamt'){ev.preventDefault();var b=document.querySelector('[data-act="pay-ok"]');if(b)b.click()}});
$('#form').addEventListener('submit',function(ev){
  ev.preventDefault();
  var btn=$('#submit');if(btn.disabled)return;
  var amt=digits($('#amt').value),who=$('#who').value.trim().replace(/\s+/g,' '),c=TYPES[cur],err=$('#err');
  if(!amt){err.textContent='Entrez un montant supérieur à zéro.';$('#amt').focus();return}
  if(c.need&&!who){err.textContent='Entrez le nom du client.';$('#who').focus();return}
  if(cur==='credit'&&!isPro()){
    var ds=debts(),k=norm(who);
    if(!ds.some(function(x){return x.key===k})&&ds.length>=CONFIG.limiteGratuite){
      err.textContent='Version gratuite : '+CONFIG.limiteGratuite+' clients en dette au maximum. Passez en Pro dans l’onglet Plus, ou encaissez une dette existante.';return}
  }
  var lines=(cur==='sale'||cur==='credit')?cart.slice():[],bad='';
  lines.forEach(function(l){var p=prodById(l.pid);if(!p||p.qty<l.q)bad=p?'Il ne reste que '+p.qty+' « '+p.name+' » en stock.':'Un produit a été supprimé : retirez-le de la liste.'});
  if(bad){err.textContent=bad;return}
  if(!who&&cur==='sale'&&lines.length)who=lines.map(function(l){return prodById(l.pid).name+' ×'+l.q}).join(', ').slice(0,60);
  err.textContent='';btn.disabled=true;setTimeout(function(){btn.disabled=false},500);
  var e=addEntry(cur,amt,who,lines);cart=[];
  var msg={sale:'Vente de ',expense:'Dépense de ',credit:'Dette de ',payment:'Paiement de '}[cur]+money(amt)+' enregistré'+(cur==='credit'?'e':'');
  toast(msg,'Annuler',function(){removeEntry(e.id)});
  $('#amt').value='';$('#who').value='';$('#amt').focus();
});
window.addEventListener('beforeinstallprompt',function(ev){ev.preventDefault();installEvt=ev;if(tab==='plus')renderPlus()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
setInterval(function(){if(!document.hidden&&document.activeElement===document.body)render()},60000);

/* ---------- démarrage ---------- */
S=load();if(S.pro&&!S.proAt){S.proAt=Date.now();persist()}
ST=loadStock();
if(stockRecovered)persistStock();
(function(){var has=false;try{has=!!localStorage.getItem(SKEY)}catch(x){}if(freshSeed&&!has&&!ST.products.length)stockDemo()})();
setType('sale');render();
if(recovered||stockRecovered)toast('Vos données ont été récupérées depuis la dernière copie.');
else if(!storageOK)toast('Ce navigateur bloque l’enregistrement. Quittez la navigation privée.');
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(x){}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
